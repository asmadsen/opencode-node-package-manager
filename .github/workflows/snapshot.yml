name: Publish Snapshot

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch:

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'publish')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - run: bun install

      - run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          publish-url: https://registry.npmjs.org

      - name: Publish snapshot to npm
        run: bunx beachball publish --yes --access public --prerelease-prefix "snapshot"
