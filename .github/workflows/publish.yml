name: Publish to npm

on:
  push:
    branches:
      - master
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - run: bun install

      - run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Bump versions, changelogs, and push back
        run: bunx beachball publish --yes --access public --no-publish

      - name: Publish to npm
        run: npm publish --provenance --access public

  publish-snapshot:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'publish')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - run: bun install

      - run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Bump versions locally (snapshot prerelease)
        run: bunx beachball bump --prerelease-prefix snapshot --yes

      - name: Publish snapshot to npm
        run: npm publish --provenance --access public --tag snapshot